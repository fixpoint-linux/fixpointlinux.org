<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fixpoint-linux — a system that never forgets itself</title>
<meta name="description" content="fixpoint-linux: a Linux system that is a fixed point — deterministically built, from source, by itself. Content-addressed by construction, time-travelling by default.">
<style>
  :root {
    --bg: #0b0e11;
    --bg2: #10141a;
    --fg: #d8dee6;
    --dim: #7d8794;
    --accent: #6ad6a1;
    --accent2: #8ab4f8;
    --line: #1e2730;
    --mono: "SFMono-Regular", "Cascadia Code", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 24px; }

  /* ---------- hero ---------- */
  header { padding: 96px 0 48px; border-bottom: 1px solid var(--line); }
  .prompt { font-family: var(--mono); font-size: 15px; color: var(--dim); margin-bottom: 20px; }
  .prompt .hash { color: var(--accent2); }
  .prompt .dollar { color: var(--dim); }
  .prompt .blink { animation: blink 1.1s step-end infinite; }
  @keyframes blink { 0%,100% {opacity:1;} 50% {opacity:0;} }
  h1 { font-size: clamp(30px, 5.5vw, 46px); font-weight: 750; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 16px; }
  h1 .fx { color: var(--accent); }
  .tagline {
    font-family: var(--mono);
    font-size: clamp(14px, 2.6vw, 17px);
    color: var(--dim);
    max-width: 620px;
  }
  .tagline b { color: var(--fg); font-weight: 600; }

  /* ---------- top nav ---------- */
  nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(11, 14, 17, 0.88);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  nav .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    height: 52px;
    max-width: 780px;
  }
  nav .brand { font-family: var(--mono); font-size: 14px; color: var(--fg); white-space: nowrap; }
  nav .brand .fx { color: var(--accent); }
  nav .links { display: flex; align-items: center; gap: 18px; overflow: visible; }
  nav .links a { font-family: var(--mono); font-size: 13px; color: var(--dim); white-space: nowrap; }
  nav .links a:hover { color: var(--fg); text-decoration: none; }
  nav .links a.dhake { color: var(--accent); font-weight: 600; }
  nav .links a.dhake:hover { color: var(--accent2); }
  /* dropdown "components" submenu */
  .dropdown { position: relative; display: inline-block; }
  .dropdown .toggle { font-family: var(--mono); font-size: 13px; color: var(--dim); white-space: nowrap; cursor: pointer; border: none; background: none; padding: 0; }
  .dropdown .toggle:hover { color: var(--fg); }
  .dropdown .menu {
    display: none; position: absolute; top: 100%; right: 0; z-index: 60;
    min-width: 200px; margin-top: 10px; padding: 6px 0;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .dropdown .menu a { display: block; font-family: var(--mono); font-size: 13px; color: var(--dim); padding: 7px 16px; white-space: nowrap; }
  .dropdown .menu a:hover { color: var(--accent); background: rgba(106,214,161,0.06); text-decoration: none; }
  .dropdown .menu a .fx { color: var(--accent); }
  .dropdown:hover .menu { display: block; }
  .dropdown .menu .ddhake { color: var(--accent); font-weight: 600; }
  @media (max-width: 620px) {
    nav .brand { display: none; }
    nav .wrap { justify-content: center; }
  }

  /* ---------- sections ---------- */
  section { padding: 56px 0; border-bottom: 1px solid var(--line); }
  h2 { font-size: 22px; font-weight: 650; margin-bottom: 6px; letter-spacing: -0.01em; }
  .hint { font-family: var(--mono); font-size: 13px; color: var(--accent2); margin-bottom: 22px; }
  p { color: #c3ccd6; margin-bottom: 14px; }
  p code, li code { font-family: var(--mono); font-size: 0.9em; background: var(--bg2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--accent); }
  a { color: var(--accent2); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- principles grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 8px; }
  .card { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 18px 18px 16px; }
  .card .n { font-family: var(--mono); font-size: 12px; color: var(--accent); display: block; margin-bottom: 8px; }
  .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .card p { font-size: 13.5px; color: var(--dim); margin: 0; }

  /* ---------- stack table ---------- */
  .stack { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .stack th { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .stack td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .stack tr:last-child td { border-bottom: none; }
  .stack td.name { font-family: var(--mono); font-size: 14px; white-space: nowrap; }
  .stack td.name a { color: var(--accent); }
  .stack td.desc { font-size: 14px; color: #c3ccd6; }
  .stack td.desc em { font-style: normal; color: var(--dim); }

  /* ---------- timeline headline ---------- */
  .timeline { font-family: var(--mono); font-size: 14px; background: var(--bg2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 18px 20px; margin: 16px 0 20px; overflow-x: auto; white-space: pre; }
  .timeline .c { color: var(--accent); }
  .timeline .dim { color: var(--dim); }

  /* ---------- code block ---------- */
  pre.code { font-family: var(--mono); font-size: 13.5px; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; overflow-x: auto; margin: 16px 0; }
  pre.code .c { color: var(--dim); }
  pre.code .g { color: var(--accent); }
  pre.code .k { color: var(--accent2); }

  /* ---------- footer ---------- */
  footer { padding: 40px 0 64px; text-align: center; color: var(--dim); font-family: var(--mono); font-size: 13px; }
  footer a { color: var(--dim); }
  footer .sep { color: var(--line); }

  ul { list-style: none; }
  ul.checks li { padding-left: 26px; position: relative; margin-bottom: 10px; color: #c3ccd6; }
  ul.checks li::before { content: "✓"; position: absolute; left: 0; color: var(--accent); font-family: var(--mono); }
</style>
<script type="importmap">
{
  "imports": {
    "@mfe/core": "/vendor/@mfe/core/index.js",
    "@mfe/framework": "/vendor/@mfe/framework/index.js",
    "fixpoint-landing": "/shell/mfe/fixpoint-landing.js"
  }
}
</script>
</head>
<body>
<div id="app" ssr>
  <div class="fixpoint-root">
    <div data-mfe="fixpoint-landing"><!-- ssg.mjs injects the pre-rendered landing markup here --></div>
  </div>
</div>
<script type="module" src="/shell/shell.js"></script>
</body>
</html>
