<!--
  shell/templates/fxstore.html — the route template for '/fxstore'.

  The [data-mfe="fxstore-page"] element is the slot the shell's reconcile mounts
  the (cross-origin, via import map) fxstore Elm MFE into. This route is
  client-only: it is not pre-rendered by ssg.mjs, and is loaded on-demand when
  the user navigates to /fxstore.
-->
<div class="fixpoint-root">
  <div data-mfe="fxstore-page"></div>
</div>
